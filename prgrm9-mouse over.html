<html>
<head>
    <title>Mouse Over</title>
</head>
<body>
<center>
<h1 id="text">Hello</h1>
<img src="1.jpeg" id="image" onmouseover="onmouse()" onmouseout="outmouse()" style="width:300px;">
</center>
<script>
function onmouse()
{
  document.getElementById('text').innerText = "Welcome to my page";
  document.getElementById('image').src = "flower.jpeg";
}
function outmouse() 
{
  document.getElementById('text').innerText = "Hello";
  document.getElementById('image').src = "1.jpeg";
}

</script>
</body>
</html>
